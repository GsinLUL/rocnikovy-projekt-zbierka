<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 620" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: bold; fill: #1f4e79; }
      .system-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: bold; fill: #333; }
      .actor-label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #111; text-anchor: middle; }
      .actor-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #666; text-anchor: middle; }
      .uc-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #1a202c; text-anchor: middle; }
      .uc-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #b7791f; font-weight: bold; text-anchor: middle; }
      .line { stroke: #4a5568; stroke-width: 1.5; fill: none; }
      .line-dashed { stroke: #718096; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .rel-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #718096; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#718096" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>

  <!-- Header -->
  <text x="30" y="38" class="title">Use Case Diagram – Systém Zbierka</text>
  <text x="30" y="58" font-family="sans-serif" font-size="12" fill="#64748b">Metodika inšpirovaná RUP | Prepojenie zberateľského portfólia a autonómneho bota</text>

  <!-- System Boundary -->
  <rect x="220" y="80" width="510" height="510" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="220" y="80" width="510" height="32" rx="12" fill="#f1f5f9"/>
  <text x="240" y="101" class="system-title">Hranica systému (Systém Zbierka)</text>

  <!-- Primary Actors (Left) -->
  <!-- Actor: Návštevník -->
  <g transform="translate(110, 150)">
    <circle cx="0" cy="-25" r="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <line x1="0" y1="-13" x2="0" y2="12" stroke="#0284c7" stroke-width="2"/>
    <line x1="-15" y1="-3" x2="15" y2="-3" stroke="#0284c7" stroke-width="2"/>
    <line x1="0" y1="12" x2="-12" y2="32" stroke="#0284c7" stroke-width="2"/>
    <line x1="0" y1="12" x2="12" y2="32" stroke="#0284c7" stroke-width="2"/>
    <text x="0" y="50" class="actor-label">Návštevník</text>
  </g>

  <!-- Actor: Zberateľ -->
  <g transform="translate(110, 310)">
    <circle cx="0" cy="-25" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <line x1="0" y1="-11" x2="0" y2="15" stroke="#2563eb" stroke-width="2.2"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#2563eb" stroke-width="2.2"/>
    <line x1="0" y1="15" x2="-14" y2="38" stroke="#2563eb" stroke-width="2.2"/>
    <line x1="0" y1="15" x2="14" y2="38" stroke="#2563eb" stroke-width="2.2"/>
    <text x="0" y="56" class="actor-label">Zberateľ</text>
    <text x="0" y="70" class="actor-sub">(Primárny aktér)</text>
  </g>

  <!-- Actor: Administrátor -->
  <g transform="translate(110, 500)">
    <circle cx="0" cy="-25" r="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <line x1="0" y1="-13" x2="0" y2="12" stroke="#ea580c" stroke-width="2"/>
    <line x1="-15" y1="-3" x2="15" y2="-3" stroke="#ea580c" stroke-width="2"/>
    <line x1="0" y1="12" x2="-12" y2="32" stroke="#ea580c" stroke-width="2"/>
    <line x1="0" y1="12" x2="12" y2="32" stroke="#ea580c" stroke-width="2"/>
    <text x="0" y="50" class="actor-label">Administrátor</text>
  </g>

  <!-- Secondary Actors (Right) -->
  <!-- Actor: Verejné API -->
  <g transform="translate(840, 220)">
    <rect x="-45" y="-30" width="90" height="60" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.8"/>
    <text x="0" y="-8" class="actor-label">&lt;&lt; Externé &gt;&gt;</text>
    <text x="0" y="10" class="actor-label">Verejné API</text>
    <text x="0" y="24" class="actor-sub">(Metadáta &amp; foto)</text>
  </g>

  <!-- Actor: Online Trhovisko (Vinted) -->
  <g transform="translate(840, 420)">
    <rect x="-55" y="-30" width="110" height="60" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.8"/>
    <text x="0" y="-8" class="actor-label">&lt;&lt; Trhovisko &gt;&gt;</text>
    <text x="0" y="10" class="actor-label">Vinted / Trhy</text>
    <text x="0" y="24" class="actor-sub">(Autonómny bot)</text>
  </g>

  <!-- Use Cases Inside System -->
  <!-- UC-001 -->
  <g transform="translate(360, 150)">
    <ellipse cx="0" cy="0" rx="110" ry="24" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="0" y="4" class="uc-text">UC-001: Registruj a prihlás zberateľa</text>
  </g>

  <!-- UC-002 -->
  <g transform="translate(360, 225)">
    <ellipse cx="0" cy="0" rx="115" ry="24" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="0" y="4" class="uc-text">UC-002: Pridaj predmet s metadátami</text>
  </g>

  <!-- Subcase: Stiahni foto a metadáta -->
  <g transform="translate(605, 225)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
    <text x="0" y="4" class="uc-text" font-size="11">Stiahni metadáta a foto</text>
  </g>

  <!-- UC-003 -->
  <g transform="translate(360, 300)">
    <ellipse cx="0" cy="0" rx="110" ry="24" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="0" y="4" class="uc-text">UC-003: Zobraz vývoj cien zbierky</text>
  </g>

  <!-- UC-004 -->
  <g transform="translate(360, 375)">
    <ellipse cx="0" cy="0" rx="115" ry="24" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="0" y="4" class="uc-text">UC-004: Nastav monitorovacieho bota</text>
  </g>

  <!-- UC-005 (Kľúčová vlastnosť) -->
  <g transform="translate(360, 460)">
    <ellipse cx="0" cy="0" rx="125" ry="28" fill="#fef9c3" stroke="#eab308" stroke-width="2.2"/>
    <text x="0" y="-2" class="uc-text">UC-005: Pridaj predmet z notifikácie</text>
    <text x="0" y="14" class="uc-sub">★ KĽÚČOVÁ VLASTNOSŤ SYSTÉMU ★</text>
  </g>

  <!-- Subcase: Prepočítaj hodnotu -->
  <g transform="translate(615, 460)">
    <ellipse cx="0" cy="0" rx="90" ry="22" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="0" y="4" class="uc-text" font-size="11">Prepočítaj hodnotu zbierky</text>
  </g>

  <!-- UC-006 -->
  <g transform="translate(360, 535)">
    <ellipse cx="0" cy="0" rx="110" ry="24" fill="#fff7ed" stroke="#f97316" stroke-width="1.6"/>
    <text x="0" y="4" class="uc-text">UC-006: Spravuj scrapery a systém</text>
  </g>

  <!-- Associations -->
  <!-- Návštevník -> UC1 -->
  <line x1="135" y1="150" x2="250" y2="150" class="line"/>

  <!-- Zberateľ -> UC1..5 -->
  <line x1="145" y1="310" x2="260" y2="160" class="line"/>
  <line x1="145" y1="310" x2="248" y2="230" class="line"/>
  <line x1="145" y1="310" x2="250" y2="300" class="line"/>
  <line x1="145" y1="310" x2="248" y2="370" class="line"/>
  <line x1="145" y1="310" x2="242" y2="450" class="line" stroke="#eab308" stroke-width="2"/>

  <!-- Admin -> UC6 -->
  <line x1="135" y1="500" x2="250" y2="535" class="line"/>

  <!-- UC2 include SubApi -->
  <line x1="475" y1="225" x2="505" y2="225" class="line-dashed" marker-end="url(#arrow)"/>
  <text x="490" y="215" class="rel-text">&lt;&lt;include&gt;&gt;</text>

  <!-- SubApi -> Api -->
  <line x1="700" y1="225" x2="795" y2="220" class="line"/>

  <!-- UC5 include SubCalc -->
  <line x1="485" y1="460" x2="520" y2="460" class="line-dashed" marker-end="url(#arrow)"/>
  <text x="502" y="450" class="rel-text">&lt;&lt;include&gt;&gt;</text>

  <!-- UC5 and Marketplace -->
  <line x1="785" y1="420" x2="480" y2="455" class="line-dashed" stroke="#eab308" marker-end="url(#arrow)"/>
  <text x="660" y="425" class="rel-text" fill="#b45309">nový inzerát</text>

  <!-- UC4 -> Marketplace -->
  <line x1="475" y1="375" x2="785" y2="415" class="line-dashed" marker-end="url(#arrow)"/>
  <text x="640" y="380" class="rel-text">pravidlá skenovania</text>

</svg>
